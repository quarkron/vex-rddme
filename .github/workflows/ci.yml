name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install the declared runtime dependencies and pytest, then install the
      # package itself with --no-deps. If a module ever imports something outside
      # the whitelist, the test run fails on ImportError rather than silently
      # acquiring a third dependency from a transitive install.
      - name: Install declared dependencies only
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest
          python -m pip install --no-deps -e .

      - name: Show installed packages
        run: python -m pip list

      # Guard messages and the README are operator-facing text. This keeps them
      # compliant with the Simplified Technical English rules rather than letting
      # prose drift back. Standard library only, so it adds no dependency.
      - name: STE lint (guard messages + README)
        run: python tools/ste_lint.py --strict

      - name: Run tests
        run: python -m pytest tests/ -v
